spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.auth-gateway.base-url=http://localhost:8081/api
minio.endpoint=http://localhost:9000
minio.public-url=http://localhost:9000
minio.drive-public-url=https://drive.example.com
minio.access-key=test-access
minio.secret-key=test-secret
minio.bucket=test-bucket
analysis.service-url=http://localhost:18080
lofi.store-type=in-memory
