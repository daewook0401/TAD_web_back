name: Deploy TAD Web

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean bootJar

      - name: Rename jar
        run: cp build/libs/*.jar app.jar

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create deploy directories on server
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            mkdir -p /home/daewook/server/tad &&
            mkdir -p /home/daewook/server/tad/config
          "

      - name: Copy deployment files to server
        run: |
          scp -P ${{ secrets.SSH_PORT }} app.jar \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/daewook/server/tad/

      - name: Deploy on server
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /home/daewook/server/tad &&
            (docker compose -f docker-compose.prod.yml down || true) &&
            docker compose -f docker-compose.prod.yml up -d --build &&
            docker image prune -f
          "
