plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tad'
version = '0.0.1-SNAPSHOT'
description = 'TAD Web Backend - Spring Boot RESTful API Server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = '21'
	targetCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	// Version Management
	lombokVersion = '1.18.30'
	postgresqlVersion = '42.7.8'
	validationVersion = '2.0.1'
	junitVersion = '5.10.0'
	mockitoVersion = '5.7.0'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'io.minio:minio:8.5.12'

	implementation "org.postgresql:postgresql:${postgresqlVersion}"

	implementation "io.github.closeup1202:lofi-spring-boot-starter:0.3.2"
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

	compileOnly "org.projectlombok:lombok:${lombokVersion}"
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// === Build Properties ===
bootRun {
	[
		'spring.profiles.active',
		'spring.datasource.url',
		'spring.datasource.username',
		'spring.datasource.password',
		'analysis.service-url',
		'lofi.store-type'
	].each { propertyName ->
		def propertyValue = System.getProperty(propertyName)
		if (propertyValue != null) {
			systemProperty propertyName, propertyValue
		}
	}
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.release = 21
	options.compilerArgs << '-parameters'
}
